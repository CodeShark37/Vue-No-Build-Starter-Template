<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Raiz da app. Alterar se for servida num sub-caminho (ex.: "/meu-repo/"). -->
    <base href="/">
    <title></title>
    <!-- Tema ANTES da 1.ª pintura: script clássico síncrono -->
    <script src="src/core/theme-boot.js"></script>
    <link rel="stylesheet" href="src/ui/theme.css">
    <style>
        /* Shell de arranque: visível enquanto as bibliotecas descarregam e executam. */
        .boot { font: 16px/1.4 system-ui, sans-serif; color: var(--text-faint); padding: 1rem; }
    </style>
</head>

<body>
    <div id="app"><p class="boot">A carregar…</p></div>
    
    <script src="env.js"></script>
    <!-- `defer`: descarregam em paralelo sem bloquear o HTML-->
    <script defer src="vendor/vue2-sfc-loader.js"></script>
    <script defer src="vendor/vuex.min.js"></script>
    <script defer src="vendor/vue-head.js"></script>
    <script defer src="vendor/vue-router.min.js"></script>
    <script defer src="vendor/axios.min.js"></script>
    <script defer src="vendor/casl.min.js"></script>

    <script type="module" src="src/main.js"></script>

    <script nomodule>
        document.getElementById("app").textContent = "Your browser doesn't support JavaScript modules :("
    </script>
</body>

</html>
