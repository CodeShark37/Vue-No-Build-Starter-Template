<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Raiz da app. Alterar se for servida num sub-caminho (ex.: "/meu-repo/"). -->
    <base href="/">
    <title></title>
    <style>
        /* Shell de arranque: visível enquanto as bibliotecas descarregam e executam. */
        .boot { font: 16px/1.4 system-ui, sans-serif; color: #555; padding: 1rem; }
    </style>
</head>

<body>
    <div id="app"><p class="boot">A carregar…</p></div>

    <!-- 1º de tudo: env.js decide QUE vue entra na fila e se o mock (Mirage) vem
         para produção. Escreve as tags por document.write NA SUA POSIÇÃO — ver env.js. -->
    <script src="env.js"></script>

    <!-- Restantes vendors (iguais em dev e produção). `defer`: descarregam em
         paralelo sem bloquear o HTML e executam pela ordem escrita, antes do
         main.js (módulos também são diferidos, na mesma fila). -->
    <script defer src="vendor/vue2-sfc-loader.js"></script>
    <script defer src="vendor/vuex.min.js"></script>
    <script defer src="vendor/vue-head.js"></script>
    <script defer src="vendor/vue-router.min.js"></script>
    <script defer src="vendor/axios.min.js"></script>
    <!-- CASL: permissões (RBAC/ABAC). core/ability.js constrói a Ability a partir
         das regras de GET /api/permissions; as vistas perguntam com this.$perm.can(...). -->
    <script defer src="vendor/casl.min.js"></script>

    <script type="module" src="src/main.js"></script>

    <script nomodule>
        document.getElementById("app").innerHTML = "Your browser doesn't support JavaScript modules :("
    </script>
</body>

</html>
